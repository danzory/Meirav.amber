<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach PRO - מירב אמבר</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f1f5f9; /* slate-100 */
            -webkit-tap-highlight-color: transparent;
        }

        /* Animations */
        .fade-in-zoom {
            animation: fadeInZoom 0.3s ease-out forwards;
        }

        @keyframes fadeInZoom {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
    </style>
</head>
<body>

    <div id="app-root"></div>

    <script>
        // --- אזור הנתונים ---
        const clientProfile = {
            name: "מירב אמבר",
            goal: "אימון אישי - שיפור כוח וטכניקה",
            workoutsCompleted: 4,
            status: "פעיל"
        };

        const videosData = [];
        
        // נתוני התקדמות של מירב
        const progressData = {
            weight: [
                { date: 'נוכחי', weight: 0 },
            ],
            strength: [
                { exercise: 'האק סקוואט', prev: 40, current: 80, reps: '8', sets: '-' },
                { exercise: 'סקוואט חופשי', prev: 40, current: 42.5, reps: '3', sets: '-' },
                { exercise: 'היפטראסט במכונה', prev: 37.5, current: 100, reps: '6', sets: '-' },
                { exercise: 'מתח גומיה אדומה (צרה)', prev: 0, current: 0, reps: '4', sets: '-' },
                { exercise: 'מתח בגרביטון רחב', prev: 35, current: 35, reps: '5', sets: '-' }, 
                { exercise: 'מקבילים בגרביטון', prev: 35, current: 21, reps: '3', sets: '-' },
                { exercise: 'חתירה מוט', prev: 30, current: 32.5, reps: '-', sets: '-' }, 
                { exercise: 'חתירה צרה במכונה', prev: 0, current: 50, reps: '6', sets: '-' }, 
                { exercise: 'פולי עליון במכונה', prev: 0, current: 60, reps: '7', sets: '-' },
                { exercise: 'לחיצת חזה בסמית', prev: 0, current: 20, reps: '4', sets: '-' },
                { exercise: 'שכיבות סמיכה (סמית)', prev: 0, current: 0, reps: '6', sets: '4' },
                { exercise: 'דדליפט רומני', prev: 35, current: 52.5, reps: '6', sets: '-' },
                { exercise: 'בולגרי יד אחת', prev: 12.5, current: 20, reps: '6', sets: '-' },
                { exercise: 'בולגרי עם שתי משקולות', prev: 15, current: 20, reps: '6', sets: '-' },
                { exercise: 'לחיצת רגליים', prev: 130, current: 130, reps: '6', sets: '-' },
                { exercise: 'לחיצת רגליים - רגל אחת', prev: 0, current: 30, reps: '8', sets: '-' },
                { exercise: 'כפיפת ברכיים שכיבה', prev: 0, current: 6, reps: '10', sets: '-' },
                { exercise: 'פרפר', prev: 8, current: 8, reps: '10', sets: '-' }, 
                { exercise: 'לחיצת כתפיים מוט', prev: 20, current: 22.5, reps: '6', sets: '-' },
                { exercise: 'סקול קראשר', prev: 15, current: 15, reps: '8', sets: '-' },
                { exercise: 'כפיפת מרפקים W', prev: 15, current: 15, reps: '8', sets: '-' },
                { exercise: 'כיסא רומי', prev: 10, current: 10, reps: '8', sets: '-' },
                { exercise: 'תאומים בלחיצת רגליים', prev: 100, current: 100, reps: '8', sets: '-' }
            ]
        };

        // --- מצב האפליקציה (State) ---
        let activeTab = 'workouts';
        let chartsInstance = [];
        let selectedProgressExercise = progressData.strength[0]?.exercise || '';

        // --- פונקציות עזר ורינדור ---

        function setTab(tabName) {
            activeTab = tabName;
            render();
        }

        // פונקציה אסינכרונית למשיכת נתונים בזמן אמת מ-Firebase (מסונכרן מול בוט הטלגרם)
        async function loadLiveWorkoutsAndRender() {
            try {
                const dbUrl = "https://trainer-2026-default-rtdb.europe-west1.firebasedatabase.app/clients/מירב/workouts.json";
                const response = await fetch(dbUrl);
                const data = await response.json();
                if (data) {
                    const fbWorkouts = Object.values(data);
                    
                    // מיון כרונולוגי של האימונים שהגיעו מטלגרם
                    fbWorkouts.sort((a, b) => new Date(a.date) - new Date(b.date));

                    fbWorkouts.forEach(fbW => {
                        let prEntry = progressData.strength.find(d => d.exercise.trim() === fbW.exercise.trim());
                        
                        // במידה ודווח בטלגרם תרגיל חדש שלא היה קיים בבסיס - הוספה אוטומטית (Dynamic Rendering)
                        if (!prEntry) {
                            prEntry = { 
                                exercise: fbW.exercise, 
                                prev: fbW.totalWeight, 
                                current: fbW.totalWeight, 
                                reps: fbW.reps, 
                                sets: '-',
                                note: 'נוסף אוטומטית מטלגרם',
                                history: [] 
                            };
                            progressData.strength.push(prEntry);
                        }
                        
                        if (!prEntry.history) prEntry.history = [];
                        prEntry.history.push({
                            date: fbW.date,
                            weight: fbW.totalWeight,
                            reps: fbW.reps
                        });
                    });

                    // סריקת כל התרגילים ועדכון שיאים דינמי
                    progressData.strength.forEach(pr => {
                        if (pr.history && pr.history.length > 0) {
                            const maxWeight = Math.max(...pr.history.map(h => h.weight));
                            const latest = pr.history[pr.history.length - 1];
                            
                            // בדיקה האם נשבר שיא והגדרת הדגל של ה-PR
                            if (latest.weight > pr.current) {
                                pr.isNewPR = true;
                                pr.current = latest.weight; // עדכון המשקל הנוכחי עבור הגרף
                            } else if (latest.weight >= maxWeight && latest.weight > pr.prev) {
                                pr.isNewPR = true;
                            }
                            
                            pr.reps = latest.reps;
                        }
                    });
                }
            } catch (err) {
                console.error("שגיאה במשיכת נתונים מהענן:", err);
            }
        }

        function updateExerciseDetails(exName) {
            selectedProgressExercise = exName;
            const exProgress = progressData.strength.find(d => d.exercise === exName);
            if (!exProgress) return;
            
            const container = document.getElementById('exerciseDetailsContent');
            if(container) {
                const isBodyweight = exProgress.current === 0 && exProgress.prev === 0;
                let prevWeightDisplay = isBodyweight ? 'משקל גוף / גומייה' : (exProgress.prev > 0 ? exProgress.prev + ' ק"ג' : '0 ק"ג');
                let currentWeightDisplay = isBodyweight ? 'משקל גוף / גומייה' : (exProgress.current > 0 ? exProgress.current + ' ק"ג' : '0 ק"ג');
                let isGraviton = exName.includes('גרביטון');
                if (isGraviton) {
                     prevWeightDisplay = exProgress.prev > 0 ? '-' + exProgress.prev + ' ק"ג' : '0 ק"ג';
                     currentWeightDisplay = exProgress.current > 0 ? '-' + exProgress.current + ' ק"ג' : '0 ק"ג';
                }

                // יצירת תגית "שיא חדש!" והערת טלגרם במידה ורלוונטי
                let newPRBadge = exProgress.isNewPR ? `<span class="bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[10px] font-black rounded px-1.5 py-0.5 inline-block align-middle mr-2 animate-pulse">שיא חדש!</span>` : '';
                let noteHtml = exProgress.note ? `
                    <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 mb-3 text-xs text-amber-400 flex items-center gap-1.5">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                        <span>${exProgress.note}</span>
                    </div>
                ` : '';

                container.innerHTML = `
                    ${noteHtml}
                    <div class="grid grid-cols-2 gap-3 mb-3 mt-2">
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                            <span class="block text-xs text-slate-500 mb-1">משקל התחלה</span>
                            <span class="text-lg font-bold text-slate-300">${prevWeightDisplay}</span>
                        </div>
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                            <span class="block text-xs text-blue-400 mb-1 flex items-center justify-between">
                                <span>שיא משקל נוכחי</span>
                                ${newPRBadge}
                            </span>
                            <span class="text-lg font-bold text-blue-400">${currentWeightDisplay}</span>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 mb-3">
                        <span class="block text-xs text-slate-500 mb-1">ביצוע באימון אחרון</span>
                        <span class="text-md font-medium text-slate-200 flex items-center gap-2">
                            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
                            ${exProgress.sets !== '-' ? exProgress.sets + ' סטים | ' : ''} ${exProgress.reps} חזרות
                        </span>
                    </div>
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                        <span class="block text-xs text-slate-500 mb-2">מעקב לאימון הבא (יעד)</span>
                        <div class="text-sm text-slate-400 italic font-mono bg-slate-950 p-2 rounded border border-slate-800">
                            סט 1: ${currentWeightDisplay} × __ חזרות <br>
                            סט 2: ${currentWeightDisplay} × __ חזרות <br>
                            סט 3: ${currentWeightDisplay} × __ חזרות
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderHeader() {
            return `
            <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
                <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
                    <div>
                        <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                            Armor builder
                        </h1>
                        <p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase mt-0.5">By Coach Dan dubrovsky</p>
                        <p class="text-sm text-slate-200 font-medium mt-1">היי, ${clientProfile.name}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-left hidden sm:block">
                            <p class="text-[10px] text-slate-400 uppercase tracking-wider">מטרה נוכחית</p>
                            <p class="text-xs font-bold text-emerald-400">${clientProfile.goal}</p>
                        </div>
                        <div class="h-10 w-10 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 relative">
                            <i data-lucide="user" class="text-slate-300 w-5 h-5"></i>
                            <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
                        </div>
                    </div>
                </div>
                
                <div class="max-w-md mx-auto px-2 flex justify-between pb-2 overflow-x-auto no-scrollbar">
                    <button onclick="setTab('progress')" class="flex flex-col items-center gap-1 p-2 min-w-[70px] rounded-xl transition-all ${activeTab === 'progress' ? 'text-purple-400 bg-purple-500/10' : 'text-slate-500'}">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium">התקדמות</span>
                    </button>

                    <button onclick="setTab('workouts')" class="flex flex-col items-center gap-1 p-2 min-w-[70px] rounded-xl transition-all relative ${activeTab === 'workouts' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-500'}">
                        <i data-lucide="dumbbell" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium">תוכנית אימונים</span>
                    </button>
                    
                    <button onclick="setTab('nutrition')" class="flex flex-col items-center gap-1 p-2 min-w-[70px] rounded-xl transition-all relative ${activeTab === 'nutrition' ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500'}">
                        <i data-lucide="lock" class="w-3 h-3 absolute top-1 right-2 text-slate-400"></i>
                        <i data-lucide="utensils" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium">תזונה</span>
                    </button>

                    <button onclick="setTab('videos')" class="flex flex-col items-center gap-1 p-2 min-w-[70px] rounded-xl transition-all ${activeTab === 'videos' ? 'text-orange-400 bg-orange-500/10' : 'text-slate-500'}">
                        <i data-lucide="play-circle" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium">הדרכות</span>
                    </button>
                </div>
            </header>`;
        }

        function renderLockedContent(title, icon, message) {
            return `
            <div class="space-y-6 fade-in-zoom flex flex-col items-center justify-center h-80 text-center mt-10">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-4 relative shadow-lg">
                    <i data-lucide="${icon}" class="w-10 h-10 text-slate-500 opacity-50"></i>
                    <div class="absolute -bottom-2 -right-2 bg-slate-900 rounded-full p-2 border border-slate-700">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                    </div>
                </div>
                <h2 class="text-xl font-bold text-slate-300">${title} נעולה</h2>
                <p class="text-slate-500 max-w-[250px] mx-auto mt-2">${message}</p>
            </div>`;
        }

        function createExerciseCard(num, name, notes, sets, reps) {
            return `
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex gap-4 items-start shadow-sm hover:border-indigo-500/50 transition-colors">
                <div class="w-10 h-10 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-lg flex-shrink-0 border border-indigo-500/30 mt-0.5">
                    ${num}
                </div>
                <div class="flex-1">
                    <h4 class="font-bold text-slate-100 text-lg">${name}</h4>
                    ${notes ? `<p class="text-sm text-slate-400 mt-1">${notes}</p>` : ''}
                    <div class="flex gap-3 mt-3 text-xs font-medium">
                        <span class="bg-slate-900 border border-slate-700 text-slate-300 px-2 py-1.5 rounded-md flex items-center gap-1.5">
                            <i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-400"></i> ${sets} סטים
                        </span>
                        <span class="bg-slate-900 border border-slate-700 text-slate-300 px-2 py-1.5 rounded-md flex items-center gap-1.5">
                            <i data-lucide="repeat" class="w-3.5 h-3.5 text-emerald-400"></i> ${reps} חזרות
                        </span>
                    </div>
                </div>
            </div>`;
        }

        function renderWorkouts() {
            return `
            <div class="space-y-6 fade-in-zoom pb-6">
                <div class="bg-indigo-600 rounded-2xl p-5 shadow-lg shadow-indigo-900/20 relative overflow-hidden mb-4">
                    <div class="relative z-10">
                        <span class="text-indigo-200 text-xs font-bold tracking-wider uppercase">תוכנית מותאמת אישית</span>
                        <h2 class="text-2xl font-bold text-white mt-1">תוכנית Full Body</h2>
                        <p class="text-indigo-100 text-sm mt-2 leading-relaxed bg-indigo-700/30 p-2 rounded-lg border border-indigo-500/30">
                            אימון גוף מלא המתמקד בתרגילי בסיס מורכבים לשיפור כוח, טכניקה ובניית מסת שריר.
                        </p>
                    </div>
                    <i data-lucide="dumbbell" class="absolute -bottom-4 -left-4 text-white/10 w-32 h-32 transform rotate-12"></i>
                </div>

                <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden mb-6 shadow-md">
                    <div class="bg-slate-900/80 p-3 border-b border-slate-700 flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-5 h-5 text-amber-400"></i>
                        <h3 class="font-bold text-slate-200">דגשים חשובים: איך לגשת לסט?</h3>
                    </div>
                    <div class="p-4 space-y-5 text-sm text-slate-300">
                        <div>
                            <strong class="text-amber-400 block mb-1.5 flex items-center gap-2"><i data-lucide="flame" class="w-4 h-4"></i> חימום לפני כל תרגיל:</strong>
                            <p class="leading-relaxed">1-3 סטים. בתרגילים פשוטים (כמו כפיפת מרפק) מספיק סט אחד, ובתרגילים מורכבים (כמו סקוואט) בצעו עד 3 סטים. הקשיבו לגוף ואל תמהרו.</p>
                            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 mt-3 text-xs font-mono text-slate-400 leading-loose">
                                <span class="text-slate-300 font-bold border-b border-slate-800 pb-1 mb-2 block">דוגמה לחימום (בחתירה עם מוט, סט עבודה 60 ק"ג):</span>
                                <span class="text-emerald-400/80">סט 1:</span> 20 ק"ג × 10 חזרות<br>
                                <span class="text-emerald-400/80">סט 2:</span> 40 ק"ג × 6 חזרות<br>
                                <span class="text-emerald-400/80">סט 3:</span> 50 ק"ג × 3 חזרות
                            </div>
                        </div>
                        <div class="border-t border-slate-700/50 pt-4">
                            <strong class="text-blue-400 block mb-1.5 flex items-center gap-2"><i data-lucide="timer" class="w-4 h-4"></i> מנוחה בין סטים:</strong>
                            <p>1-3 דקות, בהתאם לעצימות הסט וההרגשה האישית.</p>
                        </div>
                        <div class="border-t border-slate-700/50 pt-4">
                            <strong class="text-red-400 block mb-1.5 flex items-center gap-2"><i data-lucide="target" class="w-4 h-4"></i> אינטנסיביות וטכניקה:</strong>
                            <p class="leading-relaxed">המטרה היא להגיע קרוב לכשל, או עד לכשל מוחלט, בכל סט עבודה. הדגש החשוב ביותר הוא לשמור על <span class="text-white font-bold underline decoration-red-500 underline-offset-4">טכניקה נכונה</span> לאורך כל התנועה!</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold text-slate-200 flex items-center gap-2 mb-4 px-1">
                        <i data-lucide="list-checks" class="w-5 h-5 text-indigo-400"></i>
                        רשימת התרגילים
                    </h3>
                    ${createExerciseCard(1, 'סקוואט חופשי / סמית', 'רגליים ברוחב כתפיים, גב ישר, ירידה מבוקרת', '3', '6-10')}
                    ${createExerciseCard(2, 'דדליפט רומני (RDL)', 'דגש על מתיחה בהמסטרינגס, גב ישר ותנועה מהאגן', '3', '8-10')}
                    ${createExerciseCard(3, 'היפ טראסט (Hip Thrust)', 'דגש על כיווץ ישבן בשיא התנועה', '3', '8-12')}
                    ${createExerciseCard(4, 'לחיצת כתפיים מוט', '', '3', '5-10')}
                    ${createExerciseCard(5, 'מתח (גרביטון או גומיות)', '', '3', '5-10')}
                </div>
            </div>`;
        }

        function renderNutrition() {
            return renderLockedContent('תזונה', 'utensils', 'תפריט התזונה שלך יעודכן ויינעל כאן בקרוב על ידי המאמן.');
        }

        function renderProgress() {
            return `
            <div class="space-y-8 fade-in-zoom">
                <div class="bg-blue-600 rounded-2xl p-5 shadow-lg shadow-blue-900/20 relative overflow-hidden mb-6">
                    <div class="relative z-10">
                        <span class="text-blue-200 text-xs font-bold tracking-wider uppercase">אימון אישי</span>
                        <h2 class="text-2xl font-bold text-white mt-1">התקדמות ושיאים</h2>
                        <p class="text-blue-100 text-xs mt-2 leading-relaxed bg-blue-700/30 p-2 rounded-lg border border-blue-500/30">
                            כאן תוכלי לעקוב אחרי השיאים שלך בכל תרגיל מהאימונים המשותפים שלנו, המעודכנים אוטומטית ובזמן אמת.
                        </p>
                    </div>
                    <i data-lucide="trending-up" class="absolute -bottom-4 -left-4 text-white/10 w-32 h-32 transform rotate-12"></i>
                </div>

                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                        <i data-lucide="trophy" class="w-5 h-5 text-yellow-400"></i>
                        שיפור משקלי עבודה (ק"ג)
                    </h3>
                    <div class="h-[500px] w-full flex items-center justify-center">
                        ${progressData.strength.length > 0 ? `<canvas id="strengthChart"></canvas>` : `<p class="text-slate-500 text-sm">הזן נתונים כדי לראות התקדמות</p>`}
                    </div>
                </div>
          
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold text-slate-200 mb-3 flex items-center gap-2">
                        <i data-lucide="search" class="w-5 h-5 text-blue-400"></i>
                        פירוט לפי תרגיל
                    </h3>
                    <select id="exerciseSelect" onchange="updateExerciseDetails(this.value)" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-lg p-3 mb-2 focus:outline-none focus:border-blue-500 cursor-pointer">
                        ${progressData.strength.map(d => `<option value="${d.exercise}" ${d.exercise === selectedProgressExercise ? 'selected' : ''}>${d.exercise}</option>`).join('')}
                    </select>
                    <div id="exerciseDetailsContent"></div>
                </div>

                <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-xl border border-slate-700">
                    <h4 class="text-slate-300 font-medium mb-2">סיכום התמדה</h4>
                    <div class="flex justify-between items-end">
                        <div>
                            <div class="text-3xl font-bold text-white">${clientProfile.workoutsCompleted}</div>
                            <div class="text-xs text-slate-500">אימונים אישיים הושלמו</div>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-bold text-slate-500">🔥</div>
                            <div class="text-xs text-slate-500">עבודה אלופה!</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderVideos() {
            return `
            <div class="space-y-6 fade-in-zoom">
                <div class="bg-orange-600 rounded-2xl p-5 shadow-lg shadow-orange-900/20 relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="text-orange-200 text-xs font-bold tracking-wider uppercase">ספריית VOD</span>
                        <h2 class="text-2xl font-bold text-white mt-1">הדרכות טכניקה</h2>
                        <p class="text-orange-100 text-sm mt-2 opacity-90">דגשים לביצוע נכון ומניעת פציעות</p>
                    </div>
                    <i data-lucide="play-circle" class="absolute -bottom-4 -left-4 text-white/10 w-32 h-32 transform rotate-12"></i>
                </div>

                <div class="space-y-3">
                    ${videosData.length > 0 ? videosData.map(video => `
                        <a href="${video.url}" target="_blank" rel="noopener noreferrer" class="block bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-orange-500/50 transition-colors group">
                            <div class="flex justify-between items-start">
                                <div class="flex gap-4">
                                    <div class="bg-slate-900 h-12 w-12 rounded-lg flex items-center justify-center group-hover:bg-orange-500/10 transition-colors">
                                        <i data-lucide="play-circle" class="w-6 h-6 text-orange-500"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-100 group-hover:text-orange-400 transition-colors">${video.title}</h4>
                                        <span class="text-xs text-slate-500 bg-slate-900 px-2 py-0.5 rounded-full mt-1 inline-block">${video.category}</span>
                                    </div>
                                </div>
                                <i data-lucide="external-link" class="w-4 h-4 text-slate-500 group-hover:text-orange-400"></i>
                            </div>
                        </a>`).join('') : `
                        <div class="text-center py-10">
                            <p class="text-slate-500">אין סרטונים זמינים כרגע</p>
                        </div>`}
                </div>
            </div>`;
        }

        // --- אתחול הגרפים ---
        function initCharts() {
            chartsInstance.forEach(chart => chart.destroy());
            chartsInstance = [];

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Assistant, sans-serif';
            if (progressData.strength.length > 0) {
                const ctxStrength = document.getElementById('strengthChart').getContext('2d');
                const bgColorsPrev = progressData.strength.map(d => d.exercise.includes('גרביטון') ? '#64748b' : '#475569');
                const bgColorsCurrent = progressData.strength.map(d => d.exercise.includes('גרביטון') ? '#10b981' : '#3b82f6');

                const strengthChart = new Chart(ctxStrength, {
                    type: 'bar',
                    data: {
                        labels: progressData.strength.map(d => d.exercise),
                        datasets: [
                            {
                                label: 'משקל התחלה',
                                data: progressData.strength.map(d => d.prev),
                                backgroundColor: bgColorsPrev,
                                borderRadius: 4
                            },
                            {
                                label: 'שיא נוכחי',
                                data: progressData.strength.map(d => d.current),
                                backgroundColor: bgColorsCurrent,
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { color: '#e2e8f0' } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) { label += ': '; }
                                        const exerciseName = context.chart.data.labels[context.dataIndex];
                                        if (context.parsed.x !== null) {
                                            if (exerciseName.includes('גרביטון') && context.parsed.x > 0) {
                                                label += '-' + context.parsed.x + ' ק"ג';
                                            } else {
                                                label += context.parsed.x === 0 ? 'משקל גוף/גומיה' : context.parsed.x + ' ק"ג';
                                            }
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { color: '#334155', drawBorder: false } },
                            y: { grid: { display: false, drawBorder: false } }
                        }
                    }
                });
                chartsInstance.push(strengthChart);
            }
        }

        // --- הרינדור הראשי ---
        function render() {
            const root = document.getElementById('app-root');
            let mainContent = '';
            if (activeTab === 'workouts') mainContent = renderWorkouts();
            else if (activeTab === 'nutrition') mainContent = renderNutrition();
            else if (activeTab === 'progress') mainContent = renderProgress();
            else if (activeTab === 'videos') mainContent = renderVideos();
            
            root.innerHTML = `
                ${renderHeader()}
                <main class="max-w-md mx-auto p-4 pb-24">
                    ${mainContent}
                </main>
            `;
            lucide.createIcons();
            if (activeTab === 'progress') {
                initCharts();
                updateExerciseDetails(selectedProgressExercise);
            }
        }

        // --- הפעלה ראשונית של האפליקציה ---
        window.onload = async () => {
            // טעינת הנתונים מהענן לפני הרינדור הראשוני של הדף
            await loadLiveWorkoutsAndRender();
            
            if (progressData.strength.length > 0 && !selectedProgressExercise) {
                selectedProgressExercise = progressData.strength[0].exercise;
            }
            render();
        };

    </script>
</body>
</html>
