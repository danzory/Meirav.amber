<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coach PRO - מירב אמבר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #020617; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .fade-in-zoom { animation: fadeInZoom 0.3s ease-out forwards; }
        @keyframes fadeInZoom { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="app-root"></div>

    <script>
        // --- חיבור ל-Firebase ---
        const DB_URL = "https://trainer-2026-default-rtdb.europe-west1.firebasedatabase.app/clients/מירב/workouts.json";

        // מילון תרגומים - וודא שהמפתחות כאן תואמים למה שאתה שולח לבוט
        const exerciseMap = {
            "סקוואט": "squat",
            "לחיצת רגליים": "legPress",
            "האק סקוואט": "hackSquat",
            "דדליפט רומני": "romanianDeadlift",
            "פולי עליון": "latPulldown"
        };

        let liveWorkouts = [];

        async function fetchWorkouts() {
            try {
                const response = await fetch(DB_URL);
                const data = await response.json();
                if (data) {
                    liveWorkouts = Object.values(data);
                    console.log("נתונים מהענן:", liveWorkouts);
                }
                render(); // רינדור האפליקציה אחרי שיש נתונים
            } catch (e) { console.error(e); render(); }
        }

        const clientProfile = { name: "מירב אמבר", goal: "אימון אישי", status: "פעיל" };
        let activeTab = 'workouts';

        function setTab(tabName) { activeTab = tabName; render(); }

        function renderHeader() {
            return `
            <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
                <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
                    <div>
                        <h1 class="text-lg font-bold text-white">מירב אמבר</h1>
                        <p class="text-xs text-slate-400">Armor Builder | Coach Dan</p>
                    </div>
                </div>
                <div class="max-w-md mx-auto px-2 flex justify-between pb-2">
                    <button onclick="setTab('workouts')" class="p-2 ${activeTab === 'workouts' ? 'text-blue-400' : 'text-slate-500'}">אימונים</button>
                    <button onclick="setTab('progress')" class="p-2 ${activeTab === 'progress' ? 'text-purple-400' : 'text-slate-500'}">התקדמות</button>
                </div>
            </header>`;
        }

        function renderWorkouts() {
            // כאן אפשר להוסיף לוגיקה שמציגה את האימון האחרון שנמשך מה-liveWorkouts
            return `<div class="p-4 text-center">תוכנית אימונים פעילה...</div>`;
        }

        function renderProgress() {
            return `
            <div class="p-4 space-y-4">
                <h2 class="text-xl font-bold">אימונים אחרונים מהענן</h2>
                ${liveWorkouts.length > 0 ? liveWorkouts.slice(-5).reverse().map(w => `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <div class="font-bold text-blue-400">${w.exercise}</div>
                        <div class="text-sm">משקל: ${w.totalWeight} ק"ג | חזרות: ${w.reps}</div>
                    </div>
                `).join('') : '<p>אין עדיין נתונים מהאימון האחרון.</p>'}
            </div>`;
        }

        function render() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                ${renderHeader()}
                <main class="max-w-md mx-auto">
                    ${activeTab === 'workouts' ? renderWorkouts() : renderProgress()}
                </main>
            `;
            lucide.createIcons();
        }

        // טעינת הנתונים בהתחלה
        fetchWorkouts();
    </script>
</body>
</html>
